
name: TeamSpeak Heerlen - Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-installer:
    name: Maak Windows Setup.exe
    runs-on: windows-latest

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # TEAMSPEAK INSTELLINGEN BEHOUDEN
      # ==========================================

      - name: Behoud werkende TeamSpeak audio en interface
        shell: pwsh
        run: |
          & ./tools/HERSTEL-LAATSTE-TEAMSPEAK.ps1

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak-bronnen herstellen mislukt.'
          }

      # ==========================================
      # GODOT 4.7.2
      # ==========================================

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-editor.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'godot-editor'

          Invoke-WebRequest -Uri "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $zip

          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force

          $godot = Get-ChildItem -Path $folder -Filter 'Godot_v4.7.2-stable_win64_console.exe' -Recurse -File |
            Select-Object -First 1

          if (-not $godot) {
            throw 'Godot console.exe ontbreekt.'
          }

          "GODOT_BIN=$($godot.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & $godot.FullName --headless --version

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot start niet.'
          }

      # ==========================================
      # GODOT EXPORT TEMPLATES
      # ==========================================

      - name: Installeer Godot exporttemplates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          $tpz = Join-Path $env:RUNNER_TEMP 'templates.tpz'
          $zip = Join-Path $env:RUNNER_TEMP 'templates.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'templates'

          Invoke-WebRequest -Uri "$base/Godot_v4.7.2-stable_export_templates.tpz" -OutFile $tpz

          Copy-Item -LiteralPath $tpz -Destination $zip

          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force

          $source = Join-Path $folder 'templates'
          $target = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable'

          if (-not (Test-Path $source)) {
            throw 'Exporttemplates ontbreken.'
          }

          New-Item -ItemType Directory -Path $target -Force | Out-Null

          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force

          if (-not (Test-Path (Join-Path $target 'windows_release_x86_64.exe'))) {
            throw 'Windows x64 template ontbreekt.'
          }

      # ==========================================
      # NODE.JS EN TEAMSPEAK
      # ==========================================

      - name: Installeer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Controleer TeamSpeak bridge
        shell: pwsh
        run: |
          foreach ($file in @(
            'bridge/package.json',
            'bridge/main.cjs',
            'bridge/protocol.cjs'
          )) {
            if (-not (Test-Path $file)) {
              throw "Bestand ontbreekt: $file"
            }
          }

      - name: Installeer TeamSpeak en Opus
        shell: pwsh
        working-directory: ./bridge
        run: |
          npm.cmd install --omit=dev --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak bridge installatie mislukt.'
          }

      - name: Test TeamSpeak bridge
        shell: pwsh
        working-directory: ./bridge
        run: |
          npm.cmd test

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak bridge tests mislukt.'
          }

      # ==========================================
      # 100 AVATARS R1 AUTOMATISCH DOWNLOADEN
      # ==========================================

      - name: Download alle originele 100Avatars R1 3D-modellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./tools/HAAL-R1-AVATARS-AUTOMATISCH.ps1

          if ($LASTEXITCODE -ne 0) {
            throw 'Download R1 avatars mislukt.'
          }

      - name: Controleer R1 catalogus en modellen
        shell: pwsh
        run: |
          $cat = 'scripts/r1_avatar_catalog.gd'

          if (-not (Test-Path $cat)) {
            throw 'R1-catalogus ontbreekt.'
          }

          $count = @(Select-String -LiteralPath $cat -Pattern '"res://assets/avatars/100-r1/').Count

          Write-Host "TEAMSpeak HEERLEN: $count originele R1-avatarmodellen"

          if ($count -lt 70) {
            throw 'De 100Avatars R1-download is onvolledig.'
          }

      # ==========================================
      # GODOT PROJECT CONTROLEREN
      # ==========================================

      - name: Importeer Godot project
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --import --path . --quit

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot projectimport mislukt.'
          }

      - name: Test 3D Cafe opstarten
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --script 'res://tests/smoke_test.gd' --log-file 'startup-check.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'startup-check.log') {
              Get-Content 'startup-check.log' -Tail 100
            }

            throw '3D Cafe opstarttest mislukt.'
          }

      - name: Test online avatars zonder TeamSpeak-server
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --script 'res://tests/online_avatars_test.gd' --log-file 'online-avatars-check.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'online-avatars-check.log') {
              Get-Content 'online-avatars-check.log' -Tail 100
            }

            throw 'Online avatar regressietest mislukt.'
          }

      - name: Test avatars en cafe v0.8
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --script 'res://tests/visual_v07_test.gd' --log-file 'visual-test.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'visual-test.log') {
              Get-Content 'visual-test.log' -Tail 100
            }

            throw 'Avatar/uiterlijk test v0.8 mislukt.'
          }

      - name: Test Poly Pizza 100 Avatars R1
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --script 'res://tests/poly_pizza_r1_test.gd'

          if ($LASTEXITCODE -ne 0) {
            throw 'Polygonal Mind 100 Avatars R1 test mislukt.'
          }

      # ==========================================
      # WINDOWS EXE BOUWEN
      # ==========================================

      - name: Bouw Windows 3D Cafe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          & $env:GODOT_BIN --headless --path . --export-release 'Windows Desktop' 'dist/TS-Heerlen-3D-Cafe.exe'

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot Windows-export mislukt.'
          }

          if (-not (Test-Path 'dist/TS-Heerlen-3D-Cafe.exe')) {
            throw 'Windows EXE ontbreekt.'
          }

      # ==========================================
      # TEAMSPEAK MODULE MEEVERPAKKEN
      # ==========================================

      - name: Verpak TeamSpeak-module
        shell: pwsh
        run: |
          $runtime = 'dist/bridge-runtime'

          New-Item -ItemType Directory -Path $runtime -Force | Out-Null

          $node = (Get-Command node.exe).Source

          Copy-Item -LiteralPath $node -Destination "$runtime/node.exe"
          Copy-Item -LiteralPath 'bridge/main.cjs' -Destination "$runtime/main.cjs"
          Copy-Item -LiteralPath 'bridge/protocol.cjs' -Destination "$runtime/protocol.cjs"
          Copy-Item -LiteralPath 'bridge/package.json' -Destination "$runtime/package.json"

          Copy-Item -Path 'bridge/node_modules' -Destination "$runtime/node_modules" -Recurse

          foreach ($module in @(
            'opusscript',
            '@honeybbq/teamspeak-client',
            'ws'
          )) {

            if (-not (Test-Path "$runtime/node_modules/$module")) {
              throw "Bridge-module ontbreekt: $module"
            }

          }

      # ==========================================
      # INNO SETUP
      # ==========================================

      - name: Installeer Inno Setup
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )

          $compiler = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $compiler) {

            choco install innosetup -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw 'Inno Setup installatie mislukt.'
            }

            $compiler = $paths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          }

          if (-not $compiler) {
            throw 'Inno Setup compiler niet gevonden.'
          }

          "ISCC_PATH=$compiler" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ==========================================
      # WINDOWS SETUP v0.8 BOUWEN
      # ==========================================

      - name: Maak TeamSpeak Heerlen Setup.exe
        shell: pwsh
        run: |
          & $env:ISCC_PATH 'installer.iss'

          if ($LASTEXITCODE -ne 0) {
            throw 'Windows-installer bouwen mislukt.'
          }

          # Geen oude v0.7-naam meer gebruiken.
          # Controleer de werkelijk gemaakte Setup.exe.

          $setups = @(Get-ChildItem -Path 'dist/installer' -Filter 'TS-Heerlen-3D-Cafe-Setup-v*.exe' -File)

          if ($setups.Count -ne 1) {
            throw "Verwacht precies 1 Setup.exe, gevonden: $($setups.Count)."
          }

          Write-Host "WINDOWS INSTALLER GEREED: $($setups[0].Name)"

          $setups[0] | Select-Object Name, Length

      # ==========================================
      # WINDOWS SETUP v0.8 UPLOADEN
      # ==========================================

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: TS-Heerlen-3D-Cafe-Setup-v0.8
          path: dist/installer/TS-Heerlen-3D-Cafe-Setup-v*.exe
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # GITHUB RELEASE
      # ==========================================

      - name: Publiceer GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/TS-Heerlen-3D-Cafe-Setup-v*.exe
          generate_release_notes: true
