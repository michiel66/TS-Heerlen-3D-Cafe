
name: TeamSpeak Heerlen - Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-installer:
    name: Maak Windows Setup.exe
    runs-on: windows-latest

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2 officieel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-editor.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'godot-editor'

          Invoke-WebRequest -Uri "$base/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force

          $godot = Get-ChildItem -Path $folder -Filter 'Godot_v4.7.2-stable_win64_console.exe' -Recurse -File | Select-Object -First 1

          if (-not $godot) {
            throw 'Godot console.exe ontbreekt na uitpakken.'
          }

          "GODOT_BIN=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & $godot.FullName --headless --version

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot start niet correct.'
          }

      - name: Installeer exporttemplates voor Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          $tpz = Join-Path $env:RUNNER_TEMP 'godot-templates.tpz'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-templates.zip'
          $unpacked = Join-Path $env:RUNNER_TEMP 'godot-templates'

          Invoke-WebRequest -Uri "$base/Godot_v4.7.2-stable_export_templates.tpz" -OutFile $tpz
          Copy-Item -LiteralPath $tpz -Destination $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $unpacked -Force

          $source = Join-Path $unpacked 'templates'
          $target = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable'

          if (-not (Test-Path $source)) {
            throw 'Map templates ontbreekt in TPZ.'
          }

          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force

          if (-not (Test-Path (Join-Path $target 'windows_release_x86_64.exe'))) {
            throw 'Windows x64 exporttemplate ontbreekt.'
          }

          Write-Host 'Godot exporttemplates geïnstalleerd.'

      - name: Importeer 3D-cafe project
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --editor --import --path . --quit

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot projectimport mislukt. Controleer de GDScript-fouten.'
          }

      - name: Test of 3D-cafe en menu echt starten
        shell: pwsh
        run: |
          & $env:GODOT_BIN --headless --path . --script 'res://tests/smoke_test.gd' --log-file 'startup-check.log'

          if ($LASTEXITCODE -ne 0) {
            if (Test-Path 'startup-check.log') {
              Get-Content 'startup-check.log' -Tail 100
            }
            throw 'De cafe-starttest is mislukt. Setup.exe wordt NIET gemaakt.'
          }

      - name: Bouw Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          & $env:GODOT_BIN --headless --path . --export-release 'Windows Desktop' 'dist/TS-Heerlen-3D-Cafe.exe'

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot export mislukt. Controleer het log.'
          }

          if (-not (Test-Path 'dist/TS-Heerlen-3D-Cafe.exe')) {
            throw 'Windows exe niet gevonden.'
          }

          Get-Item 'dist/TS-Heerlen-3D-Cafe.exe' | Select-Object Name, Length

      - name: Installeer Inno Setup
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )

          $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $compiler) {
            choco install innosetup -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw 'Inno Setup installatie mislukt.'
            }

            $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $compiler) {
            throw 'ISCC.exe niet gevonden.'
          }

          "ISCC_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Maak TeamSpeak Heerlen Setup.exe
        shell: pwsh
        run: |
          & $env:ISCC_PATH 'installer.iss'

          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup compile mislukt.'
          }

          $setup = 'dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.2.1.exe'

          if (-not (Test-Path $setup)) {
            throw 'Setup.exe ontbreekt.'
          }

          Get-Item $setup | Select-Object Name, Length

      - name: Download Windows-installer
        uses: actions/upload-artifact@v4
        with:
          name: TS-Heerlen-3D-Cafe-Setup-v0.2.1
          path: dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.2.1.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publiceer bij versie-tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.2.1.exe
          generate_release_notes: true
