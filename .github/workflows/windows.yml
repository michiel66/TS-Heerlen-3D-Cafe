
name: TeamSpeak Heerlen - Windows Setup

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-installer:
    name: Maak Windows Setup.exe
    runs-on: windows-latest

    steps:

      # ========================================
      # 1. PROJECT OPHALEN
      # ========================================

      - name: Project ophalen
        uses: actions/checkout@v4

      # ========================================
      # 2. GODOT 4.7.2 INSTALLEREN
      # ========================================

      - name: Download Godot 4.7.2 officieel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-editor.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'godot-editor'

          Invoke-WebRequest `
            -Uri "$base/Godot_v4.7.2-stable_win64.exe.zip" `
            -OutFile $zip

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $folder `
            -Force

          $godot = Get-ChildItem `
            -Path $folder `
            -Filter 'Godot_v4.7.2-stable_win64_console.exe' `
            -Recurse -File |
            Select-Object -First 1

          if (-not $godot) {
            throw 'Godot console.exe ontbreekt.'
          }

          "GODOT_BIN=$($godot.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV `
            -Append -Encoding utf8

          & $godot.FullName --headless --version

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot start niet correct.'
          }

      # ========================================
      # 3. WINDOWS EXPORT TEMPLATES
      # ========================================

      - name: Installeer Godot exporttemplates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'

          $tpz = Join-Path $env:RUNNER_TEMP 'templates.tpz'
          $zip = Join-Path $env:RUNNER_TEMP 'templates.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'templates'

          Invoke-WebRequest `
            -Uri "$base/Godot_v4.7.2-stable_export_templates.tpz" `
            -OutFile $tpz

          Copy-Item $tpz $zip

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $folder `
            -Force

          $source = Join-Path $folder 'templates'

          $target = Join-Path `
            $env:APPDATA `
            'Godot\export_templates\4.7.2.stable'

          if (-not (Test-Path $source)) {
            throw 'Exporttemplates ontbreken.'
          }

          New-Item -ItemType Directory `
            -Path $target -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $source '*') `
            -Destination $target `
            -Recurse -Force

          if (-not (Test-Path (Join-Path $target 'windows_release_x86_64.exe'))) {
            throw 'Windows x64 exporttemplate ontbreekt.'
          }

          Write-Host 'Godot exporttemplates gereed.'

      # ========================================
      # 4. NODE.JS 22 INSTALLEREN
      # ========================================

      - name: Installeer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Controleer Node en npm
        shell: pwsh
        run: |
          node --version
          npm.cmd --version

          if ($LASTEXITCODE -ne 0) {
            throw 'Node.js of npm werkt niet.'
          }

      # ========================================
      # 5. TEAMSPEAK BRIDGE CONTROLEREN
      # ========================================

      - name: Controleer TeamSpeak bridge bestanden
        shell: pwsh
        run: |
          if (-not (Test-Path 'bridge/package.json')) {
            throw 'bridge/package.json ontbreekt.'
          }

          if (-not (Test-Path 'bridge/main.cjs')) {
            throw 'bridge/main.cjs ontbreekt.'
          }

          if (-not (Test-Path 'bridge/protocol.cjs')) {
            throw 'bridge/protocol.cjs ontbreekt.'
          }

          Write-Host 'TeamSpeak bridge gevonden.'

      # ========================================
      # 6. NPM FOUT HERSTELD
      # ========================================

      - name: Installeer TeamSpeak en Opus
        shell: pwsh
        working-directory: ./bridge
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Werkmap: $(Get-Location)"

          if (-not (Test-Path 'package.json')) {
            throw 'package.json ontbreekt in bridge-map.'
          }

          npm.cmd install --omit=dev --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak bridge installatie mislukt.'
          }

          Write-Host 'TeamSpeak en Opus geinstalleerd.'

      # ========================================
      # 7. BRIDGE TESTEN
      # ========================================

      - name: Test TeamSpeak bridge
        shell: pwsh
        working-directory: ./bridge
        run: |
          npm.cmd test

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak bridge tests mislukt.'
          }

          Write-Host 'Bridge tests geslaagd.'

      # ========================================
      # 8. GODOT PROJECT IMPORTEREN
      # ========================================

      - name: Importeer 3D Cafe project
        shell: pwsh
        run: |
          & $env:GODOT_BIN `
            --headless `
            --editor `
            --import `
            --path . `
            --quit

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot projectimport mislukt.'
          }

      # ========================================
      # 9. 3D CAFE OPSTARTTEST
      # ========================================

      - name: Test of 3D Cafe start
        shell: pwsh
        run: |
          & $env:GODOT_BIN `
            --headless `
            --path . `
            --script 'res://tests/smoke_test.gd' `
            --log-file 'startup-check.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'startup-check.log') {
              Get-Content 'startup-check.log' -Tail 100
            }

            throw '3D Cafe opstarttest mislukt.'
          }

          Write-Host '3D Cafe opstarttest geslaagd.'

      # ========================================
      # 10. WINDOWS APP BOUWEN
      # ========================================

      - name: Bouw Windows 3D Cafe
        shell: pwsh
        run: |
          New-Item -ItemType Directory `
            -Path dist -Force | Out-Null

          & $env:GODOT_BIN `
            --headless `
            --path . `
            --export-release 'Windows Desktop' `
            'dist/TS-Heerlen-3D-Cafe.exe'

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot export mislukt.'
          }

          if (-not (Test-Path 'dist/TS-Heerlen-3D-Cafe.exe')) {
            throw 'Windows EXE ontbreekt.'
          }

          Write-Host 'Windows cafe succesvol gebouwd.'

      # ========================================
      # 11. TEAMSPEAK MODULE MEEVERPAKKEN
      # ========================================

      - name: Verpak TeamSpeak module
        shell: pwsh
        run: |
          $runtime = 'dist/bridge-runtime'

          New-Item -ItemType Directory `
            -Path $runtime -Force | Out-Null

          $node = (Get-Command node.exe).Source

          Copy-Item `
            -LiteralPath $node `
            -Destination "$runtime/node.exe"

          Copy-Item `
            -LiteralPath 'bridge/main.cjs' `
            -Destination "$runtime/main.cjs"

          Copy-Item `
            -LiteralPath 'bridge/protocol.cjs' `
            -Destination "$runtime/protocol.cjs"

          Copy-Item `
            -LiteralPath 'bridge/package.json' `
            -Destination "$runtime/package.json"

          Copy-Item `
            -Path 'bridge/node_modules' `
            -Destination "$runtime/node_modules" `
            -Recurse

          if (-not (Test-Path "$runtime/node_modules/opusscript")) {
            throw 'Opus codec ontbreekt.'
          }

          if (-not (Test-Path "$runtime/node_modules/@honeybbq/teamspeak-client")) {
            throw 'TeamSpeak protocol ontbreekt.'
          }

          if (-not (Test-Path "$runtime/node_modules/ws")) {
            throw 'WebSocket module ontbreekt.'
          }

          Write-Host 'TeamSpeak module compleet verpakt.'

      # ========================================
      # 12. INNO SETUP INSTALLEREN
      # ========================================

      - name: Installeer Inno Setup
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )

          $compiler = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $compiler) {

            choco install innosetup -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw 'Inno Setup installatie mislukt.'
            }

            $compiler = $paths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $compiler) {
            throw 'Inno Setup compiler niet gevonden.'
          }

          "ISCC_PATH=$compiler" |
            Out-File -FilePath $env:GITHUB_ENV `
            -Append -Encoding utf8

      # ========================================
      # 13. WINDOWS SETUP.EXE MAKEN
      # ========================================

      - name: Maak TeamSpeak Heerlen Setup.exe
        shell: pwsh
        run: |
          & $env:ISCC_PATH 'installer.iss'

          if ($LASTEXITCODE -ne 0) {
            throw 'Windows installer bouwen mislukt.'
          }

          $setup = 'dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.3.exe'

          if (-not (Test-Path $setup)) {
            throw 'Setup.exe ontbreekt.'
          }

          Get-Item $setup |
            Select-Object Name, Length

          Write-Host 'TeamSpeak Heerlen Setup.exe gereed.'

      # ========================================
      # 14. INSTALLER DOWNLOADBAAR MAKEN
      # ========================================

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: TS-Heerlen-3D-Cafe-Setup-v0.3
          path: dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.3.exe
          if-no-files-found: error
          retention-days: 30

      # ========================================
      # 15. GITHUB RELEASE PUBLICEREN
      # ========================================

      - name: Publiceer GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.3.exe
          generate_release_notes: true
