
name: TeamSpeak Heerlen - Windows Setup v0.8

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/live-meeting-overlay-v1]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-installer:
    name: Maak Windows Setup v0.8
    runs-on: windows-latest

    steps:
      # ==========================================
      # PROJECT OPHALEN
      # ==========================================

      - name: Project ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # BESTAANDE TEAMSPEAK AUDIO BEHOUDEN
      # ==========================================

      - name: Behoud werkende TeamSpeak audio en interface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & pwsh -NoProfile -NonInteractive -File `
            "./tools/HERSTEL-LAATSTE-TEAMSPEAK.ps1"

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak-bronnen herstellen mislukt.'
          }

          Write-Host 'TeamSpeak bronbestanden gereed.'

      # ==========================================
      # GODOT 4.7.2 DOWNLOADEN
      # ==========================================

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'

          $zip = Join-Path $env:RUNNER_TEMP 'godot-editor.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'godot-editor'

          Invoke-WebRequest `
            -Uri "$base/Godot_v4.7.2-stable_win64.exe.zip" `
            -OutFile $zip

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $folder `
            -Force

          $godot = Get-ChildItem `
            -Path $folder `
            -Filter 'Godot_v4.7.2-stable_win64_console.exe' `
            -Recurse -File |
            Select-Object -First 1

          if (-not $godot) {
            throw 'Godot console.exe ontbreekt.'
          }

          "GODOT_BIN=$($godot.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          & $godot.FullName --headless --version

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot start niet.'
          }

          Write-Host 'Godot 4.7.2 gereed.'

      # ==========================================
      # GODOT EXPORT TEMPLATES
      # ==========================================

      - name: Installeer Godot exporttemplates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $base = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable'

          $tpz = Join-Path $env:RUNNER_TEMP 'templates.tpz'
          $zip = Join-Path $env:RUNNER_TEMP 'templates.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'templates'

          Invoke-WebRequest `
            -Uri "$base/Godot_v4.7.2-stable_export_templates.tpz" `
            -OutFile $tpz

          Copy-Item `
            -LiteralPath $tpz `
            -Destination $zip

          Expand-Archive `
            -LiteralPath $zip `
            -DestinationPath $folder `
            -Force

          $source = Join-Path $folder 'templates'

          $target = Join-Path `
            $env:APPDATA `
            'Godot\export_templates\4.7.2.stable'

          if (-not (Test-Path $source)) {
            throw 'Exporttemplates ontbreken.'
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $source '*') `
            -Destination $target `
            -Recurse `
            -Force

          if (-not (
            Test-Path (
              Join-Path $target 'windows_release_x86_64.exe'
            )
          )) {
            throw 'Windows x64 exporttemplate ontbreekt.'
          }

          Write-Host 'Godot exporttemplates gereed.'

      # ==========================================
      # NODE.JS 22
      # ==========================================

      - name: Installeer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ==========================================
      # TEAMSPEAK BESTANDEN CONTROLEREN
      # ==========================================

      - name: Controleer TeamSpeak bridge
        shell: pwsh
        run: |
          foreach ($file in @(
            'bridge/package.json',
            'bridge/main.cjs',
            'bridge/protocol.cjs',
            'scripts/teamspeak_bridge.gd'
          )) {
            if (-not (Test-Path $file)) {
              throw "TeamSpeak bestand ontbreekt: $file"
            }
          }

          Write-Host 'TeamSpeak bridge aanwezig.'

      # ==========================================
      # TEAMSPEAK EN OPUS INSTALLEREN
      # ==========================================

      - name: Installeer TeamSpeak en Opus
        shell: pwsh
        working-directory: ./bridge
        run: |
          npm.cmd install --omit=dev --no-audit --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak bridge installatie mislukt.'
          }

      # ==========================================
      # TEAMSPEAK AUDIO TESTEN
      # ==========================================

      - name: Test TeamSpeak bridge
        shell: pwsh
        working-directory: ./bridge
        run: |
          npm.cmd test

          if ($LASTEXITCODE -ne 0) {
            throw 'TeamSpeak bridge tests mislukt.'
          }

          Write-Host 'TeamSpeak bridge tests geslaagd.'

      # ==========================================
      # 100 AVATARS R1 DOWNLOADEN
      # ==========================================

      - name: Download 100Avatars R1 modellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $script = './tools/HAAL-R1-AVATARS-AUTOMATISCH.ps1'

          if (-not (Test-Path $script)) {
            throw 'Avatar-downloadscript ontbreekt.'
          }

          Write-Host '100Avatars R1 download starten...'

          # Apart PowerShell-proces voor betrouwbare exitcode.
          & pwsh -NoProfile -NonInteractive -File $script

          $downloadExitCode = $LASTEXITCODE

          if ($downloadExitCode -ne 0) {
            throw "Avatar-downloadscript faalde: exitcode $downloadExitCode"
          }

          Write-Host '100Avatars R1 download voltooid.'

      # ==========================================
      # AVATAR CATALOGUS CONTROLEREN
      # ==========================================

      - name: Controleer 100Avatars R1 catalogus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $catalog = 'scripts/r1_avatar_catalog.gd'

          if (-not (Test-Path $catalog)) {
            throw 'R1 avatarcatalogus ontbreekt.'
          }

          $matches = @(
            Select-String `
              -LiteralPath $catalog `
              -Pattern '"res://assets/avatars/100-r1/'
          )

          $count = $matches.Count

          Write-Host "Aantal R1 avatars: $count"

          if ($count -lt 70) {
            throw "Te weinig R1 avatars gevonden: $count"
          }

          $models = @(
            Get-ChildItem `
              -Path 'assets/avatars/100-r1' `
              -Recurse `
              -File |
              Where-Object {
                $_.Extension.ToLowerInvariant() -in @(
                  '.fbx', '.glb', '.gltf'
                )
              }
          )

          Write-Host "Aantal 3D-modelbestanden: $($models.Count)"

          if ($models.Count -lt 70) {
            throw 'Onvoldoende 3D-avatarbestanden.'
          }

          Write-Host 'R1 cataloguscontrole geslaagd.'

      # ==========================================
      # GODOT PROJECT IMPORTEREN
      # ==========================================

      - name: Importeer Godot project
        shell: pwsh
        run: |
          & $env:GODOT_BIN `
            --headless `
            --editor `
            --import `
            --path . `
            --quit

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot projectimport mislukt.'
          }

          Write-Host 'Godot project geimporteerd.'

      # ==========================================
      # GODOT OPSTARTTEST
      # ==========================================

      - name: Test 3D Cafe opstarten
        shell: pwsh
        run: |
          & $env:GODOT_BIN `
            --headless `
            --path . `
            --script 'res://tests/smoke_test.gd' `
            --log-file 'startup-check.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'startup-check.log') {
              Get-Content 'startup-check.log' -Tail 100
            }

            throw '3D Cafe opstarttest mislukt.'
          }

          Write-Host '3D Cafe opstarttest geslaagd.'

      # ==========================================
      # ONLINE AVATARS TESTEN
      # ==========================================

      - name: Test online avatars
        shell: pwsh
        run: |
          & $env:GODOT_BIN `
            --headless `
            --path . `
            --script 'res://tests/online_avatars_test.gd' `
            --log-file 'online-avatar-check.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'online-avatar-check.log') {
              Get-Content 'online-avatar-check.log' -Tail 100
            }

            throw 'Online avatar test mislukt.'
          }

          Write-Host 'Online avatars test geslaagd.'

      # ==========================================
      # UITERLIJK EN SPREEKINDICATOR TESTEN
      # ==========================================

      - name: Test 3D avatars en spreekindicator
        shell: pwsh
        run: |
          & $env:GODOT_BIN `
            --headless `
            --path . `
            --script 'res://tests/visual_v07_test.gd' `
            --log-file 'visual-test.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'visual-test.log') {
              Get-Content 'visual-test.log' -Tail 100
            }

            throw 'Avatar en uiterlijk test mislukt.'
          }

          Write-Host 'Avatar en spreekindicator tests geslaagd.'

      # ==========================================
      # POLY PIZZA R1 TEST
      # ==========================================

      - name: Test Poly Pizza 100 Avatars R1
        shell: pwsh
        run: |
          & $env:GODOT_BIN `
            --headless `
            --path . `
            --script 'res://tests/poly_pizza_r1_test.gd' `
            --log-file 'poly-pizza-check.log'

          if ($LASTEXITCODE -ne 0) {

            if (Test-Path 'poly-pizza-check.log') {
              Get-Content 'poly-pizza-check.log' -Tail 120
            }

            throw '100Avatars R1 test mislukt.'
          }

          Write-Host '100Avatars R1 test geslaagd.'

      # ==========================================
      # VERGADERKAMER / LIVE STOELEN REGRESSIETEST
      # ==========================================

      - name: Test live vergaderkamer en lege stoelen
        shell: pwsh
        run: |
          & $env:GODOT_BIN \
            --headless \
            --path . \
            --script 'res://tests/meeting_overlay_test.gd' \
            --log-file 'meeting-overlay-check.log'

          if ($LASTEXITCODE -ne 0) {
            if (Test-Path 'meeting-overlay-check.log') {
              Get-Content 'meeting-overlay-check.log' -Tail 140
            }
            throw 'Live vergaderkamer-test mislukt.'
          }

          Write-Host 'Live vergaderkamer-test geslaagd.'

      # ==========================================
      # WINDOWS EXE BOUWEN
      # ==========================================

      - name: Bouw Windows 3D Cafe
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Path dist `
            -Force | Out-Null

          & $env:GODOT_BIN `
            --headless `
            --path . `
            --export-release `
            'Windows Desktop' `
            'dist/TS-Heerlen-3D-Cafe.exe'

          if ($LASTEXITCODE -ne 0) {
            throw 'Godot Windows-export mislukt.'
          }

          if (-not (
            Test-Path 'dist/TS-Heerlen-3D-Cafe.exe'
          )) {
            throw 'Windows EXE ontbreekt.'
          }

          Write-Host 'Windows 3D Cafe EXE gereed.'

      # ==========================================
      # TEAMSPEAK RUNTIME VERPAKKEN
      # ==========================================

      - name: Verpak TeamSpeak module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $runtime = 'dist/bridge-runtime'

          New-Item `
            -ItemType Directory `
            -Path $runtime `
            -Force | Out-Null

          $node = (Get-Command node.exe).Source

          Copy-Item `
            -LiteralPath $node `
            -Destination "$runtime/node.exe"

          Copy-Item `
            -LiteralPath 'bridge/main.cjs' `
            -Destination "$runtime/main.cjs"

          Copy-Item `
            -LiteralPath 'bridge/protocol.cjs' `
            -Destination "$runtime/protocol.cjs"

          Copy-Item `
            -LiteralPath 'bridge/package.json' `
            -Destination "$runtime/package.json"

          Copy-Item `
            -Path 'bridge/node_modules' `
            -Destination "$runtime/node_modules" `
            -Recurse

          foreach ($module in @(
            'opusscript',
            '@honeybbq/teamspeak-client',
            'ws'
          )) {
            if (-not (
              Test-Path "$runtime/node_modules/$module"
            )) {
              throw "TeamSpeak module ontbreekt: $module"
            }
          }

          Write-Host 'TeamSpeak runtime verpakt.'

      # ==========================================
      # INNO SETUP INSTALLEREN
      # ==========================================

      - name: Installeer Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )

          $compiler = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $compiler) {

            choco install innosetup -y --no-progress

            if ($LASTEXITCODE -ne 0) {
              throw 'Inno Setup installatie mislukt.'
            }

            $compiler = $paths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $compiler) {
            throw 'Inno Setup compiler ontbreekt.'
          }

          "ISCC_PATH=$compiler" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host 'Inno Setup gereed.'

      # ==========================================
      # WINDOWS SETUP v0.8 BOUWEN
      # ==========================================

      - name: Maak TeamSpeak Heerlen Setup v0.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & $env:ISCC_PATH 'installer.iss'

          if ($LASTEXITCODE -ne 0) {
            throw 'Windows-installer bouwen mislukt.'
          }

          $setups = @(
            Get-ChildItem `
              -Path 'dist/installer' `
              -Filter 'TS-Heerlen-3D-Cafe-Setup-v0.8.exe' `
              -File
          )

          if ($setups.Count -ne 1) {
            throw 'Setup.exe v0.8 ontbreekt.'
          }

          Write-Host '======================================'
          Write-Host 'TEAM SPEAK HEERLEN SETUP v0.8 GEREED'
          Write-Host '======================================'

          $setups[0] |
            Select-Object Name, Length

      # ==========================================
      # WINDOWS SETUP UPLOADEN
      # ==========================================

      - name: Upload Windows Setup v0.8
        uses: actions/upload-artifact@v4
        with:
          name: TS-Heerlen-3D-Cafe-Setup-v0.8
          path: dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.8.exe
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # GITHUB RELEASE
      # ==========================================

      - name: Publiceer GitHub Release v0.8
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/TS-Heerlen-3D-Cafe-Setup-v0.8.exe
          generate_release_notes: true
